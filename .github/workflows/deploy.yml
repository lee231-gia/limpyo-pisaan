name: Build Flutter Browser Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /limpyo-pisaan-preview/ --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: Limpyo-Pisaan-Browser-Preview
          path: flutter_app/build/web
          retention-days: 14
          if-no-files-found: error
